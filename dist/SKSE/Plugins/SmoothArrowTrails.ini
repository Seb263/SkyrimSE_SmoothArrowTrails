; Smooth Arrow Trails - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# Completely enables or disables the mod (1 enable, 0 disable).
bEnabled = 1


[Main]
# Minimum tracer scale at spawn (in units)
fTracerScaleMin = 0.05

# Maximum tracer scale at full distance (in units)
fTracerScaleMax = 1.0

# Distance at which the tracer starts scaling up (in units)
fTracerDistanceMin = 128.0

# Distance at which the tracer reaches its maximum scale (in units)
fTracerDistanceMax = 1024.0
